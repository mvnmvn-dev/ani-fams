<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">FAMS Logo</title>
  <desc id="desc">Facilities and Administrative Management System mark  building and shield</desc>

  <!-- Rounded app tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#142E4C"/>

  <!-- Soft inner panel -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="#020F1C" opacity="0.35"/>

  <!-- Administrative shield silhouette -->
  <path
    d="M64 28
       C78 32 90 34 96 36
       V62
       C96 78 82 90 64 98
       C46 90 32 78 32 62
       V36
       C38 34 50 32 64 28Z"
    fill="#F8F8F8"
    opacity="0.96"/>

  <!-- Facility building mark -->
  <rect x="46" y="46" width="36" height="38" rx="3" fill="#142E4C"/>

  <!-- Window columns -->
  <rect x="51" y="51" width="6" height="10" rx="1.2" fill="#BBC3C8"/>
  <rect x="61" y="51" width="6" height="10" rx="1.2" fill="#BBC3C8"/>
  <rect x="71" y="51" width="6" height="10" rx="1.2" fill="#BBC3C8"/>
  <rect x="51" y="65" width="6" height="10" rx="1.2" fill="#5E7288"/>
  <rect x="61" y="65" width="6" height="10" rx="1.2" fill="#5E7288"/>
  <rect x="71" y="65" width="6" height="10" rx="1.2" fill="#5E7288"/>

  <!-- Entry -->
  <rect x="58" y="78" width="12" height="6" rx="1.5" fill="#CCAD9F"/>

  <!-- Accent baseline (admin / operations) -->
  <rect x="42" y="90" width="44" height="4" rx="2" fill="#A06A56"/>
</svg>
